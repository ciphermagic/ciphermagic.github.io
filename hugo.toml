baseURL = "https://www.ciphermagic.cn/"
title = "Cipher's Blog"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
theme = "PaperMod"
contentDir = "content"
publishDir = "public"
hasCJKLanguage = true
IsProduction = false
uglyURLs = true

[pagination]
  pagerSize = 10

[permalinks]
  posts = "/:contentbasename"

[menu]
  [[menu.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 2
  [[menu.main]]
    identifier = "categories"
    name = "分类"
    url = "/categories/"
    weight = 3
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 4
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 5

[params]
  defaultTheme = "auto"
  showShareButtons = false
  showReadingTime = true
  showWordCount = true
  dateFormat = "2006年1月2日"
  ShowPostOnHomePage = "list"
  ShowCodeCopyButtons = true
  ShowSocialIcons = true
  SocialIconPosition = "footer"
  googleAnalytics = ""
  ShowToc = true          
  TocOpen = true

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/ciphermagic"
[[params.socialIcons]]
  name = "twitter"
  url  = "https://x.com/0xCipherMagic"
[[params.socialIcons]]
  name = "telegram"
  url  = "https://t.me/ciphermagic"
[[params.socialIcons]]
  name = "email"
  url  = "mailto:ciphermagic@gmail.com"  

[taxonomies]
  category = "categories"
  tag = "tags"

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true           
    guessSyntax = false          
    lineNos = true              
    lineNumbersInTable = false 
    noClasses = false          
    style = "catppuccin-mocha"

[mediaTypes]
  [mediaTypes."font/woff2"]
    suffixes = ["woff2"]

[outputFormats.WOFF2]
  mediaType = "font/woff2"    
