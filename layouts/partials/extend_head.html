{{- if or (eq .Kind "page") (eq .Kind "section") -}}
  {{- if .Params.math -}}
    <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        tags: 'ams'
      },
      svg: {
        fontCache: 'global'
      },
      options: {
        ignoreHtmlClass: 'tex2jax_ignore', // 忽略带有此类的元素
        processHtmlClass: 'tex2jax_process' // 只处理带有此类的元素（通常不设）
      },
    };
    </script>
    <script type="text/javascript" id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js">
    </script>
  {{- end -}}
  {{ if .Store.Get "hasMermaid" }}
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
      mermaid.initialize({
        startOnLoad: true,
        theme: 'default'  // 或 'dark' 等
      });
    </script>
  {{ end }}
{{- end -}}
